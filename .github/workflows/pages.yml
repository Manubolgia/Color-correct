name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the offline caches list every file the apps need
        run: node tools/check-assets.mjs

      - name: Stamp the build so installed apps pick up the update
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/" app/sw.js app/reels/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: app

      - id: deployment
        uses: actions/deploy-pages@v4
